//apply plugin: "com.android.library"
//apply plugin: plugin.kotlinAndroid
//apply plugin: "com.google.devtools.ksp"
plugins {
    id ("com.android.library")
    id ("com.google.devtools.ksp")
}
android {
    namespace='com.yanzhenjie.andserver.api'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        consumerProguardFiles 'proguard-rules.txt'
    }

    compileOptions {
        sourceCompatibility=JavaVersion.VERSION_17
        targetCompatibility=JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig=true
    }
    buildTypes {
        release {
            buildConfigField "java.lang.String", "PROJECT_VERSION", "\"${POM_VERSION}\""
        }
        debug {
            buildConfigField "java.lang.String", "PROJECT_VERSION", "\"${POM_VERSION}\""
        }
    }
}

dependencies {
    api project(':annotation')

    implementation ("com.yanzhenjie.apache:httpcore:4.4.16")
    implementation ("com.yanzhenjie.apache:fileupload:1.4")
    compileOnly ("androidx.annotation:annotation:1.11.0")
    implementation ("org.jetbrains.kotlin:kotlin-stdlib:2.2.0")
}

//apply from: publishScript