import org.jetbrains.kotlin.gradle.dsl.JvmTarget
apply plugin: plugin.javaLibrary
apply plugin: plugin.kotlinJvm
apply plugin: plugin.ksp

compileJava {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    api project(':annotation')

    implementation deps.poet
    implementation deps.apache.lang
    implementation deps.apache.collections
    implementation deps.kotlinStdlib
    implementation deps.kspSymbolProcessingApi
    implementation("com.squareup:kotlinpoet:2.2.0")
    implementation("com.squareup:kotlinpoet-ksp:2.2.0")
}

