org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# Kotlin/KSP 编译进程单独的堆内存
kotlin.daemon.jvmargs=-Xmx4g

# KSP 进程内存（关键）
ksp.useKSP2=true
ksp.worker.maxHeapSize=4g

org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
android.useAndroidX=true
kotlin.code.style=official

